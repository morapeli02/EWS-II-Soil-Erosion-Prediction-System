{% extends "base.html" %}

{% block title %}Home - Soil Erosion Platform{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h1>Manage News</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <textarea id="content" name="content">
                {{ news.content | safe if about_us else '' }}
            </textarea>
            <button type="submit" name="action" value="add" class="btn btn-success">Add News</button>
        </form>

        <h2 class="mt-5">Existing News</h2>
        <ul class="list-group">
            {% for news in news_list %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <strong>{{ news.title }}</strong>
                    <p>{{ news.content|safe }}</p>
                </div>
                <form method="POST" class="d-inline">
                    <input type="hidden" name="news_id" value="{{ news.id }}">
                    <button type="submit" name="action" value="delete" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endblock %}
