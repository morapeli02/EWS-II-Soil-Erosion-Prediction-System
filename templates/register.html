{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg p-4" style="border-radius: 20px;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Public Registration</h2>
                    <span class="badge bg-secondary">Regular User Access Only</span>
                </div>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">USERNAME</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">EMAIL ADDRESS</label>
                        <input type="email" name="email" class="form-control" required placeholder="example@mail.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">PASSWORD</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">CONFIRM PASSWORD</label>
                        <input type="confirm_password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mt-3">Create User Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
