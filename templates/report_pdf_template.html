<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soil Erosion Report</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
  </style>
</head>
<body>
  <h2>Soil Erosion Report</h2>
  <p><strong>Region:</strong> {{ region.region_name }}</p>
  <p><strong>Year:</strong> {{ estimate.year }}</p>
  <p><strong>Generated by:</strong> {{ author }}</p>
  <p><strong>Date:</strong> {{ date.strftime("%Y-%m-%d %H:%M") }}</p>

  <hr>
  <h4>Soil Loss Estimate</h4>
  <p><strong>Estimated Value:</strong> {{ estimate.estimated_soil_loss }} t/ha</p>

  <hr>
  <h4>Expert Opinion</h4>
  <p>{{ content }}</p>
</body>
</html>
